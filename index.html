    border-radius: 4px;
    background: var(--panel);

    showHome();
  }
  window.scrollTo(0, 0);

// ====== ПОИСК (нечёткое совпадение, терпимое к опечаткам) ======
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
    }
  }
  return d[m][n];
}

function fuzzyMatch(text, query) {
  if (!query) return true;
  text = text.toLowerCase();
  query = query.toLowerCase().trim();
  if (text.includes(query)) return true;
  const textWords = text.split(/\s+/);
  const queryWords = query.split(/\s+/);
  return queryWords.every(qw =>
    textWords.some(tw => levenshtein(tw, qw) <= Math.max(1, Math.ceil(qw.length / 3)))
  );
}

function authorMatchesQuery(author, query) {
  if (fuzzyMatch(author.name, query)) return true;
  return author.books.some(book => {
    if (fuzzyMatch(book.title, query)) return true;
    if (book.volumes) {
      return book.volumes.some(vol => fuzzyMatch(vol.title, query));
    }
    return false;
  });
}

function showHome(filterText = '') {
  const query = filterText.trim();
  const filtered = AUTHORS
    .filter(a => authorMatchesQuery(a, query))
    .sort((a, b) => a.name.localeCompare(b.name, 'ru'));

  let listHtml = '';
  if (filtered.length === 0) {
    listHtml = '<div class="no-results">Ничего не найдено</div>';
  } else {
    filtered.forEach(author => {
      listHtml += `<button class="author-btn" data-id="${author.id}">${author.name}</button>`;
    });
  }

  content.innerHTML = `
    <input type="text" id="authorSearch" placeholder="Поиск автора или книги…" autocomplete="off" value="${filterText}">
    <div id="authorButtons">${listHtml}</div>
  `;

  const search = document.getElementById('authorSearch');
  search.addEventListener('input', () => showHome(search.value));
  search.focus();
  search.setSelectionRange(search.value.length, search.value.length);

  content.querySelectorAll('.author-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      window.location.hash = `author/${btn.dataset.id}`;
    });
  });
}

  `;

  if (author.books.length === 0) {
    html += `<p class="empty">Пока нет книг в этом разделе.</p>`;
  } else {
    const sortedBooks = [...author.books].sort((a, b) =>
      a.title.localeCompare(b.title, 'ru', { numeric: true })
    );
    sortedBooks.forEach(book => {
      const bookIndex = author.books.indexOf(book);
      if (book.volumes) {
        let volumesHtml = '';
        book.volumes.forEach(vol => {
          volumesHtml += `
            <div class="volume-item">
              <h4>${vol.title}</h4>
              <span class="file-info">${vol.format}, ${vol.size}</span>
              <div class="book-actions">
                ${vol.readUrl ? `<a class="read-btn" href="${vol.readUrl}">Читать</a>` : ''}
                ${vol.downloadUrl ? `<a class="download-btn" href="${vol.downloadUrl}" data-filename="${vol.title}.pdf">Скачать</a>` : ''}
              </div>
            </div>
          `;
        });
        html += `
          <div class="book-card">
            ${book.cover ? `<img class="cover" src="${book.cover}" alt="${book.title}">` : ''}
            <div class="card-body">
              <h3>${book.title}</h3>
              ${book.description ? `<p class="description">${book.description}</p>` : ''}
              <div class="volume-list">${volumesHtml}</div>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="book-card">
            ${book.cover ? `<img class="cover" src="${book.cover}" alt="${book.title}">` : ''}
            <div class="card-body">
              <h3>${book.title}</h3>
              ${book.author ? `<span class="book-author">${book.author}</span>` : ''}
              ${book.description ? `<p class="description">${book.description}</p>` : ''}
              <span class="file-info">${book.format}, ${book.size}</span>
              <div class="book-actions">
                ${book.readUrl ? `<a class="read-btn" href="${book.readUrl}">Читать</a>` : ''}
                ${book.downloadUrl ? `<a class="download-btn" href="${book.downloadUrl}" data-filename="${book.title}.pdf">Скачать</a>` : ''}
              </div>
            </div>
          </div>
        `;
      }
    });
  }

  html += `</div>`;
  content.innerHTML = html;

  content.querySelector('[data-back]').addEventListener('click', () => {
    window.location.hash = '';
  });

  const bioBtn = content.querySelector('[data-bio]');
  if (bioBtn) {
    bioBtn.addEventListener('click', () => {
      window.location.hash = `bio/${id}`;
    });
  }

  content.querySelectorAll('.download-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const url = btn.getAttribute('href');
      const filename = btn.dataset.filename;
      const tempLink = document.createElement('a');
      tempLink.href = url;
      tempLink.download = filename;
      tempLink.style.display = 'none';
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
    });
  });
}

function showReader(path) {
  const parts = path.split('/');
  const authorId = parts[0];
  const bookIndex = parseInt(parts[1], 10);
  const author = AUTHORS.find(a => a.id === authorId);
  const book = author && author.books[bookIndex];

  if (!book) { showHome(); return; }

  content.innerHTML = `
    <span class="back-link" data-back="reader">← Назад к книгам</span>
    <h2 style="margin: 0 0 12px; font-size: 18px;">${book.title}</h2>
    <iframe src="${book.readUrl}" class="pdf-frame"></iframe>
  `;

  content.querySelector('[data-back]').addEventListener('click', () => {
    window.location.hash = `author/${authorId}`;
  });
}

function showAuthorBio(id) {
  const author = AUTHORS.find(a => a.id === id);
  if (!author) { showHome(); return; }

  const bioText = author.bio ? author.bio : 'Биография скоро появится.';

  content.innerHTML = `
    <span class="back-link" data-back="author">← Назад к книгам</span>
    <div class="bio-view">
      <h2>${author.name}</h2>
      <p>${bioText}</p>
    </div>
  `;

  content.querySelector('[data-back]').addEventListener('click', () => {
    window.location.hash = `author/${id}`;
  });
}

window.addEventListener('hashchange', router);
router();
</script>
